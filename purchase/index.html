<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>System V3 · 사입 관리</title>
    <meta name="theme-color" content="#fffbe8">
    <link rel="icon" href="../assets/system-v3-icon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.css">
    <link rel="stylesheet" href="../src/styles/workspaceNavigation.css?v=20261015-cs1">
    <link rel="stylesheet" href="../src/styles/purchase.css?v=20261028-remote-board1">
  </head>
  <body class="purchase-workspace">
    <div id="purchase-app" class="purchase-shell">
      <header class="purchase-topbar">
        <div class="purchase-brand">
          <span class="purchase-brand-icon" aria-hidden="true">PK</span>
          <div>
            <h1>System V3</h1>
            <p>사입 관리</p>
          </div>
        </div>
        <nav class="workspace-navigation" aria-label="상위 업무" data-workspace-base="../">
          <a id="workspace-picking-link" class="workspace-link" href="../?write=0&amp;events=0">피킹시스템</a>
          <a id="workspace-cs-link" class="workspace-link" href="../cs/?write=0&amp;events=0">CS 관리</a>
          <a id="workspace-purchase-link" class="workspace-link is-current" href="./?write=0&amp;events=0" aria-current="page">사입 관리</a>
        </nav>
        <div class="purchase-toolbar"></div>
      </header>

      <main id="purchase-main" class="purchase-main">
        <aside id="purchase-sidebar" class="purchase-sidebar">
          <button id="purchase-sidebar-toggle" class="purchase-sidebar-toggle" type="button" aria-expanded="true" title="사이드바 접기">◀</button>
          <nav class="purchase-tabs" aria-label="사입 관리 메뉴">
            <button class="purchase-tab active" type="button" data-purchase-tab="order" aria-current="page">발주</button>
            <button class="purchase-tab" type="button" data-purchase-tab="receiving">입고</button>
          </nav>
        </aside>

        <section class="purchase-panel" data-purchase-panel="order" aria-labelledby="purchase-order-title">
          <div class="purchase-panel-head">
            <div>
              <h2 id="purchase-order-title">발주</h2>
              <p>재고체크 · 주문서 · 발주 — 사무실 PC 원격 실행</p>
            </div>
          </div>
          <div class="purchase-panel-body">
            <div class="remote-board" data-remote-board="order"></div>
          </div>
        </section>

        <section class="purchase-panel" data-purchase-panel="receiving" aria-labelledby="purchase-receiving-title" hidden>
          <div class="purchase-panel-head">
            <div>
              <h2 id="purchase-receiving-title">입고</h2>
              <p>재고매칭 · 셀피아 주문서 등록 — 사무실 PC 원격 실행</p>
            </div>
          </div>
          <div class="purchase-panel-body">
            <div class="remote-board" data-remote-board="receiving"></div>
          </div>
        </section>
      </main>
    </div>
    <div id="purchase-toast" class="purchase-toast" role="status" aria-live="polite" hidden></div>
    <script type="module" src="../src/app/workspaceNavigation.mjs?v=20261028-purchase1"></script>
    <script type="module" src="../src/app/purchaseApp.mjs?v=20261028-purchase1"></script>
    <script type="module" src="../src/app/remoteBoardPanel.mjs?v=20261028-remote-board1"></script>
  </body>
</html>
