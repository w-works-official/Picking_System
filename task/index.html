<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>System V3 · 업무 관리</title>
    <meta name="theme-color" content="#fff4c2">
    <link rel="icon" href="../assets/system-v3-icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/system-v3-icon-180.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="System V3">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pretendard/1.3.9/static/pretendard.css">
    <link rel="stylesheet" href="../src/styles/workspaceNavigation.css?v=20261125-work1">
    <link rel="stylesheet" href="../src/styles/purchase.css?v=20261110-new3">
    <link rel="stylesheet" href="../src/styles/pickingNotice.css?v=20261118-hdr1">
    <link rel="stylesheet" href="../src/styles/work.css?v=20261125-work1">
  </head>
  <!-- 2026-11-25 📋 업무 관리 (상품 관리 옆 · 노랑 테마) — 틀은 상품 관리 화면과 같고 색만 work.css 에서 바꿈 -->
  <body class="purchase-workspace work-workspace">
    <div id="work-app" class="purchase-shell">
      <header class="purchase-topbar">
        <div class="purchase-brand">
          <span class="purchase-brand-icon work-brand-icon" aria-hidden="true">WK</span>
          <div>
            <h1>System V3</h1>
            <p>업무 관리</p>
          </div>
        </div>
        <nav class="workspace-navigation" aria-label="상위 업무" data-workspace-base="../">
          <a id="workspace-picking-link" class="workspace-link" href="../?write=0&amp;events=0">피킹시스템</a>
          <a id="workspace-cs-link" class="workspace-link" href="../cs/?write=0&amp;events=0">CS 관리</a>
          <a id="workspace-purchase-link" class="workspace-link" href="../purchase/?write=0&amp;events=0">상품 관리</a>
          <a id="workspace-work-link" class="workspace-link is-current" href="./?write=0&amp;events=0" aria-current="page">업무 관리</a>
        </nav>
        <div id="pk-notice" class="pk-notice" aria-label="공지 메모"></div>
        <div class="purchase-toolbar"></div>
      </header>

      <main id="work-main" class="purchase-main work-main">
        <aside id="work-sidebar" class="purchase-sidebar">
          <button id="work-sidebar-toggle" class="purchase-sidebar-toggle" type="button" aria-expanded="true" title="사이드바 접기">◀</button>
          <nav class="purchase-tabs" aria-label="업무 관리 메뉴">
            <h3 class="purchase-tab-group">업무</h3>
            <button class="purchase-tab active" type="button" data-work-tab="log" aria-current="page">업무 내역</button>
            <h3 class="purchase-tab-group">배송</h3>
            <button class="purchase-tab is-mock" type="button" data-work-tab="ship">배송 내역</button>
          </nav>
        </aside>

        <section class="purchase-panel" data-work-panel="log" aria-labelledby="work-log-title">
          <div class="purchase-panel-head">
            <div>
              <h2 id="work-log-title">업무 내역</h2>
              <p>직원별 하루 업무 정리 — 자주 하는 업무에서 골라 [복사] → 오전·오후로 끌어 놓기 → [저장] (달력에 남음 · 다음 날은 새로)</p>
            </div>
          </div>
          <div class="purchase-panel-body work-body" id="work-log-root">
            <div class="wk-top">
              <button type="button" class="wk-btn" data-wk-step="-1" title="전날">◀</button>
              <input type="date" class="wk-date" data-wk-date>
              <button type="button" class="wk-btn" data-wk-step="1" title="다음 날">▶</button>
              <button type="button" class="wk-btn" data-wk-today>오늘</button>
              <button type="button" class="wk-btn wk-btn-main" data-wk-addslot>＋ 슬롯</button>
              <span class="wk-state" data-wk-state></span>
            </div>
            <div class="wk-layout">
              <div class="wk-cal-box" data-wk-cal></div>
              <div class="wk-slots" data-wk-slots></div>
            </div>
          </div>
        </section>

        <!-- 목업: 배송 내역 (자리만) -->
        <section class="purchase-panel" data-work-panel="ship" aria-labelledby="work-ship-title" hidden>
          <div class="purchase-panel-head">
            <div>
              <h2 id="work-ship-title">배송 내역</h2>
              <p>배송 내역 정리 — 준비 중 (목업)</p>
            </div>
          </div>
          <div class="purchase-panel-body"><div class="purchase-mock">🛠 준비 중입니다. 기능이 정해지면 이 자리에 만듭니다.</div></div>
        </section>
      </main>
    </div>

    <div id="wk-hist" class="wk-modal" hidden>
      <div class="wk-modal-card" role="dialog" aria-modal="true" aria-labelledby="wk-hist-title">
        <div class="wk-modal-head"><h3 id="wk-hist-title" data-hist-title>업무 내역</h3><button type="button" data-hist-close>닫기</button></div>
        <div class="wk-modal-body" data-hist-body></div>
      </div>
    </div>

    <script type="module" src="../src/app/workspaceNavigation.mjs?v=20261125-work1"></script>
    <script type="module" src="../src/app/workBoot.mjs?v=20261125-work1"></script>
    <script type="module" src="../src/app/pickingNoticeBoot.mjs?v=20261118-hdr1"></script>
  </body>
</html>
